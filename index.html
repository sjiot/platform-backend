<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>callingApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== AppColors ===== */
  :root {
    --background: #f5f6f8;   /* 60% 바탕 */
    --surface:    #ffffff;   /* 30% 카드 */
    --text:       #34383f;   /* 번호·제목·구분선 */
    --text-sub:   #8b9098;   /* 부가 정보 (24px 이상만) */
    --border:     #e2e5e9;   /* 테두리 */
    --yellow:     #ffdf82;   /* 호출 */
    --red:        #f39ca9;   /* 오류 */

    --font-num:  "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
    --font-sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

    --space-2: 8px; --space-4: 16px; --space-6: 24px; --space-12: 48px;
    --radius-sm: 12px; --radius-md: 20px; --radius-pill: 999px;
    --slide-time: 700ms;
  }

  html, body { margin: 0; height: 100%; background: var(--background); overflow: hidden; cursor: none;
               touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }

  /* 1080×1920 무대를 화면에 맞춰 축소/확대 */
  .stage {
    position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px;
    transform-origin: center center; background: var(--background); color: var(--text);
    font-family: var(--font-sans); display: flex; flex-direction: column;
  }

  .sec-label .guide { font-size: 28px; white-space: nowrap; font-weight: 500; letter-spacing: -.5px; margin-left: 8px; }
  .sec-label .offline { margin: 0 0 0 auto; }
  .offline { display: none; margin-right: 20px; font-size: 24px; font-weight: 700; color: var(--text); background: var(--red);
             padding: 8px 20px; border-radius: var(--radius-pill); }
  .offline.show { display: inline-block; }

  .sec-label { display: flex; align-items: center; gap: 20px; font-size: 52px; line-height: 1.15; font-weight: 800; color: var(--text-sub); margin: 0 0 var(--space-6); }
  .sec-label .dot { width: 26px; height: 26px; border-radius: var(--radius-pill); background: var(--yellow); }
  .badge { margin-left: auto; font-size: 32px; font-weight: 700; color: var(--text); background: var(--surface);
           border: 2px solid var(--border); padding: 6px 20px; border-radius: var(--radius-pill); }

  /* 호출 영역 */
  /* 상단 로고 */
  .hdr { flex: none; height: 84px; padding: 0 var(--space-6); display: flex; align-items: center; justify-content: center; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .brand img { height: 48px; width: auto; display: block; mix-blend-mode: multiply; user-select: none; -webkit-user-drag: none; }
  .brand span { font-size: 22px; font-weight: 700; color: var(--text-sub); letter-spacing: -.5px; }
  .hdr .bar { width: 2px; height: 32px; background: var(--border); border-radius: var(--radius-pill); }
  #logoIot { cursor: default; -webkit-tap-highlight-color: transparent; }

  /* 관리자 팝업 */
  .admin { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
           background: rgba(52, 56, 63, .86); cursor: auto; }
  .admin.show { display: flex; }
  .admin .box { width: 640px; background: var(--surface); border-radius: var(--radius-md); padding: 48px; box-sizing: border-box; text-align: center; }
  .admin h2 { margin: 0 0 8px; font-size: 44px; font-weight: 800; }
  .admin p { margin: 0 0 24px; font-size: 26px; color: var(--text-sub); }
  .admin .pw { height: 84px; margin-bottom: 8px; border: 2px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center;
               justify-content: center; font-size: 56px; letter-spacing: 14px; font-weight: 700; }
  .admin .msg { height: 36px; font-size: 24px; font-weight: 700; color: #d6455a; }
  .admin .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 16px; }
  .admin button { height: 96px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--background);
                  font: 700 44px var(--font-num); color: var(--text); cursor: pointer; }
  .admin button:active { background: var(--yellow); }
  .admin .row { display: flex; gap: 12px; }
  .admin .row button { flex: 1; font: 800 32px var(--font-sans); }
  .admin .row .ok { background: var(--text); color: var(--surface); border-color: var(--text); }

  .calls { flex: none; padding: 48px var(--space-12) 32px; }
  .slots { display: flex; flex-direction: column; gap: var(--space-6); }
  .slot {
    height: 220px; border-radius: var(--radius-md); background: var(--surface); border: 2px solid var(--border);
    display: flex; align-items: center; padding: 0 var(--space-12); box-sizing: border-box; overflow: hidden;
  }
  .slot .st { font-size: 44px; font-weight: 800; width: 260px; flex: none; }
  .slot .st small { display: block; font-size: 24px; font-weight: 500; color: var(--text-sub); margin-top: 6px; }
  .slot .num { margin-left: auto; font-family: var(--font-num); font-size: 200px; line-height: .9; font-weight: 700;
               letter-spacing: -2px; font-variant-numeric: tabular-nums; color: var(--text); }
  .slot.idle .num { color: var(--border); }
  .slot.assembling .num { color: var(--text-sub); }
  .slot.assembling .st small::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .slot.calling { border: 6px solid var(--yellow); }
  .slot.flash { background: var(--yellow); border-color: var(--yellow); animation: flash 1s steps(1) 5; }
  .slot.flash .st, .slot.flash .st small { color: var(--text); }
  .slot.enter .num { animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes flash { 50% { background: var(--surface); } }
  @keyframes pop { from { transform: translateY(40%); opacity: 0; } }

  /* 가로선 */
  .divider { flex: none; margin: 0 var(--space-12); height: 6px; border-radius: var(--radius-pill); background: var(--text); }

  /* 대기 영역 */
  .waiting { flex: 1; padding: 32px var(--space-12) 0; display: flex; flex-direction: column; min-height: 0; }
  .viewport { overflow: hidden; flex: none; height: 724px; }
  .track { display: flex; height: 100%; transition: transform var(--slide-time) cubic-bezier(.6,0,.2,1); }
  .page { flex: 0 0 100%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: var(--space-4); }
  .tile {
    background: var(--surface); border: 2px solid var(--border); box-sizing: border-box; border-radius: var(--radius-sm);
    display: grid; place-items: center; font-family: var(--font-num); font-size: 76px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .tile.next { box-shadow: inset 0 0 0 3px var(--text); }
  .empty { flex: 0 0 100%; display: grid; place-items: center; color: var(--text-sub); font-size: 32px; }
  .pager { display: flex; justify-content: center; align-items: center; gap: var(--space-2); height: 64px; }
  .pager i { width: 14px; height: 14px; border-radius: var(--radius-pill); background: var(--border); transition: width .4s, background .4s; }
  .pager i.on { width: 44px; background: var(--text); }
  .pager span { margin-left: 16px; font-size: 24px; color: var(--text-sub); font-family: var(--font-num); font-weight: 600; }

  /* 알림음 켜기 안내 (브라우저가 소리를 막고 있을 때만 표시) */
  .unlock { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: var(--space-6); background: rgba(52, 56, 63, .82); color: var(--surface); text-align: center; }
  .unlock.show { display: flex; }
  .unlock b { font-size: 64px; font-weight: 800; }
  .unlock span { font-size: 32px; font-weight: 500; }

  .ftr { height: 96px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500;
         color: var(--text-sub); border-top: 2px solid var(--border); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="calls">
    <div class="sec-label"><span class="dot"></span>호출 중<span class="guide">번호가 호출되면 해당 조립대로 와주세요</span><span class="offline" id="offline">연결 끊김</span></div>
    <div class="slots" id="slots"></div>
  </section>

  <div class="divider" role="separator"></div>

  <section class="waiting">
    <div class="sec-label">대기 중 <span class="badge" id="count">0명</span></div>
    <div class="viewport"><div class="track" id="track"></div></div>
    <div class="pager" id="pager"></div>
  </section>

  <div class="unlock" id="unlock"><b>화면을 터치해 시작</b><span>호출 알림음을 켜려면 한 번 터치해 주세요</span></div>

  <div class="admin" id="admin">
    <div class="box">
      <h2>관리자 확인</h2>
      <p>비밀번호를 입력하면 화면을 종료할 수 있습니다</p>
      <div class="pw" id="pwView"></div>
      <div class="msg" id="pwMsg"></div>
      <div class="pad" id="pwPad"></div>
      <div class="row"><button type="button" id="pwCancel">취소</button><button type="button" class="ok" id="pwOk">확인</button></div>
    </div>
  </div>

  <div class="hdr">
    <div class="brand"><img src="logo_sejong.png" alt=""><span>세종대학교</span></div>
    <div class="bar"></div>
    <div class="brand" id="logoIot"><img src="logo_iot.png" alt=""><span>사물인터넷혁신융합대학사업단</span></div>
  </div>
</div>

<script>
/* =====================================================================
   설정
   ===================================================================== */
const CONFIG = {
  // API 서버 주소 — 프로토콜·포트 포함, 끝에 / 없이
  API_BASE: 'http://192.168.0.100:5000',
  // 관리자 비밀번호 — 숫자 12자리 이내 (로고 3초 안에 7번 클릭 시 팝업)
  ADMIN_PW: '2026',
  // id = /display/status 응답의 station_id
  STATIONS: [
    { id: 1, name: '조립대 1' },
    { id: 2, name: '조립대 2' },
    { id: 3, name: '조립대 3' },
  ],
  PER_PAGE: 20,          // 4열 × 5행
  PAGE_MS: 6000,         // 페이지 머무는 시간
  FLASH_MS: 10000,       // 새 호출 강조 시간
  POLL_MS: 1000,         // 상태 조회 주기 (호출 칸 · 대기 목록 모두)
  FETCH_TIMEOUT_MS: 5000, // 요청 하나가 이보다 오래 걸리면 실패 처리 (폴링 멈춤 방지)
  ADMIN_TAPS: 7, ADMIN_WINDOW_MS: 3000,  // 로고 3초 안에 7번 클릭 시 관리자 팝업
  OFFLINE_AFTER: 3,      // 연속 이 횟수만큼 조회 실패해야 '연결 끊김' 표시
};

/* =====================================================================
   API 연동
   GET {API_BASE}/display/status
     → { "stations": [ { "station_id": 1, "order_seq": 12, "status": "calling" }, ... ], "waiting": [13, 14] }
     status  calling    → 호출 중
             assembling → 조립 중
             idle       → 슬롯 비움 (order_seq 는 null)
     어떤 번호를 어디에 띄울지는 서버가 정한다. 화면은 응답을 그대로 그린다.
     조회 실패·형식 오류면 직전 화면 유지
   ===================================================================== */

/* 번호 비교 (숫자 38 과 문자열 "038" 도 같은 번호로 봄) */
function sameSeq(a, b) {
  if (a == null || b == null) return false;
  const na = Number(a), nb = Number(b);
  return Number.isFinite(na) && Number.isFinite(nb) ? na === nb : String(a).trim() === String(b).trim();
}

/* 응답 → { calls: [{ no, status } | null, ...], waiting: [번호, ...] }  (calls 는 CONFIG.STATIONS 순서)
   형식을 알 수 없으면 예외 → 직전 화면 유지 */
function parseDisplay(data) {
  if (!data || !Array.isArray(data.stations) || !Array.isArray(data.waiting)) throw new Error('/display/status: 응답 형식 오류');
  const calls = CONFIG.STATIONS.map(st => {
    const s = data.stations.find(x => x && sameSeq(x.station_id, st.id));
    return !s || s.status === 'idle' || s.order_seq == null ? null : { no: s.order_seq, status: s.status };
  });
  return { calls, waiting: data.waiting };
}

async function getJSON(path) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.API_BASE + path, { cache: 'no-store', signal: ctrl.signal, headers: { 'ngrok-skip-browser-warning': 'true' } });
    const txt = (await res.text()).trim();
    let data; try { data = JSON.parse(txt); } catch { data = txt; }
    if (!res.ok) throw new Error(`${path} → ${res.status}`);
    return data;
  } finally { clearTimeout(timer); }
}

let failStreak = 0;                                  // 연속 실패 횟수
let firstLoad = true;
async function poll() {
  try {
    const { calls, waiting } = parseDisplay(await getJSON('/display/status'));
    failStreak = 0;
    QueueBoard.setOnline(true);
    // 처음 켰을 때 이미 떠 있던 호출은 새 호출이 아니므로 차임·깜빡임 없이 표시
    QueueBoard.update({ calls: firstLoad ? calls.map(c => c && { ...c, silent: true }) : calls, waiting });
    firstLoad = false;
  } catch (e) {
    console.warn('poll failed', e);
    failStreak++;
    QueueBoard.setOnline(failStreak < CONFIG.OFFLINE_AFTER);   // 한두 번 실패로는 표시 안 함
  } finally {
    setTimeout(poll, CONFIG.POLL_MS);            // 폴링은 계속
  }
}

/* =====================================================================
   화면 상태
   calls[i] = { no, at, status: 'calling' | 'assembling' } | null
   waiting  = [번호, ...]  (QueueBoard.update({ waiting }) 로 넣을 수 있음)
   ===================================================================== */
const state = { calls: CONFIG.STATIONS.map(() => null), waiting: [] };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(3, '0');

/* ---------- 화면 맞춤 ---------- */
const stage = $('stage');
function fit() {
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- 호출 슬롯 ---------- */
let calmTimer = null;
function renderSlots(enterIdx = []) {
  const box = $('slots');
  const now = Date.now(); let nextCalm = Infinity;
  CONFIG.STATIONS.forEach(({ name }, i) => {
    const c = state.calls[i];
    const age = c ? now - c.at : Infinity;
    const assembling = c && c.status === 'assembling';
    const fresh = !assembling && age < CONFIG.FLASH_MS;
    if (fresh) nextCalm = Math.min(nextCalm, CONFIG.FLASH_MS - age);
    const kind = !c ? 'idle' : assembling ? 'assembling' : fresh ? 'flash' : 'calling';
    const sig = `${kind}|${c ? c.no : ''}`;
    const old = box.children[i];
    // 내용이 그대로면 손대지 않음 → 깜빡임·등장 애니메이션이 중간에 다시 시작되지 않음
    if (old && old.dataset.sig === sig && !enterIdx.includes(i)) return;
    const el = document.createElement('div');
    el.dataset.sig = sig;
    el.className = 'slot ' + kind + (enterIdx.includes(i) ? ' enter' : '');
    el.innerHTML = `<div class="st">${name}<small>${!c ? '대기' : assembling ? '조립 중' : fresh ? '지금 호출' : '호출 중'}</small></div>
                    <div class="num">${c ? pad(c.no) : '—'}</div>`;
    old ? old.replaceWith(el) : box.appendChild(el);
  });
  clearTimeout(calmTimer);
  if (nextCalm !== Infinity) calmTimer = setTimeout(() => renderSlots(), nextCalm + 50);
}

/* ---------- 대기 번호 페이지 ---------- */
let page = 0, pages = 1;
function renderWaiting() {
  const list = state.waiting, track = $('track');
  $('count').textContent = `${list.length}명`;
  pages = Math.max(1, Math.ceil(list.length / CONFIG.PER_PAGE));
  page = Math.min(page, pages - 1);
  track.innerHTML = '';
  if (!list.length) track.innerHTML = '<div class="empty">대기 중인 번호가 없습니다</div>';
  for (let p = 0; p < pages && list.length; p++) {
    const pg = document.createElement('div'); pg.className = 'page';
    list.slice(p * CONFIG.PER_PAGE, (p + 1) * CONFIG.PER_PAGE).forEach((n, i) => {
      const t = document.createElement('div');
      t.className = 'tile' + (p === 0 && i === 0 ? ' next' : '');
      t.textContent = pad(n); pg.appendChild(t);
    });
    track.appendChild(pg);
  }
  renderPager(); move();
}
function renderPager() {
  const el = $('pager'); el.innerHTML = '';
  if (pages < 2) return;
  for (let i = 0; i < pages; i++) { const d = document.createElement('i'); if (i === page) d.className = 'on'; el.appendChild(d); }
  const s = document.createElement('span'); s.textContent = `${page + 1} / ${pages}`; el.appendChild(s);
}
function move() { $('track').style.transform = `translateX(-${page * 100}%)`; }
setInterval(() => { if (pages < 2) return; page = (page + 1) % pages; move(); renderPager(); }, CONFIG.PAGE_MS);

/* ---------- 차임 (새 호출 시) ---------- */
// 브라우저는 사용자가 화면을 한 번 누르기 전까지 소리를 막음(자동재생 정책).
// 막혀 있으면 '화면을 터치해 시작' 안내를 띄우고, 터치하면 소리를 켬.
// (크롬을 --autoplay-policy=no-user-gesture-required 로 띄우면 안내 없이 바로 재생)
let audio = null;
try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
/* 전체화면: 브라우저 정책상 터치/키 입력 직후에만 가능 → 첫 터치 때 진입, 풀리면 다음 터치에 복귀.
   (크롬이면 Esc를 약 2초 길게 눌러야 해제 — 실수로 풀리는 것 방지) */
let adminExited = false;                 // 관리자가 종료한 뒤에는 자동 전체화면 복귀 안 함
function goFullscreen() {
  try {
    const el = document.documentElement;
    if (adminExited || document.fullscreenElement || !el.requestFullscreen) return;
    el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
      if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['Escape']).catch(() => {});
    }).catch(() => {});
  } catch (e) {}
}
function unlockAudio() {
  if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
  $('unlock').classList.remove('show');
  goFullscreen();
}
if (audio && audio.state !== 'running') $('unlock').classList.add('show');
['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio));

function chime() {
  try {
    if (!audio) return;
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    [880, 660].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.35;
      o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.start(t); o.stop(t + 0.65);
    });
  } catch (e) {}
}

/* ---------- 음성 호출 (새로 '호출 중'이 된 조립대만, 번호당 딱 한 번) ---------- */
// 새 호출이 들어온 순간(entered)에만 실행되고, 조립 중 전환·같은 번호 재조회·첫 로딩 때는 실행되지 않음.
const synth = window.speechSynthesis || null;
function particle(name) { return '036'.includes(String(name).trim().slice(-1)) ? '으로' : '로'; }
function speakCall(idx) {
  try {
    if (!synth) return;
    const c = state.calls[idx], name = CONFIG.STATIONS[idx].name;
    if (!c) return;
    const u = new SpeechSynthesisUtterance(`${parseInt(c.no, 10)}번 고객님, ${name}${particle(name)} 와주세요.`);
    u.lang = 'ko-KR'; u.rate = 0.95;
    synth.speak(u);                                  // 여러 조립대가 동시에 호출되면 순서대로 읽음
  } catch (e) {}
}

/* =====================================================================
   외부에서 호출하는 함수:  QueueBoard.update({ calls, waiting })
   ===================================================================== */
window.QueueBoard = {
  update(next) {
    const entered = [];
    if (Array.isArray(next.calls)) {
      CONFIG.STATIONS.forEach((_, i) => {
        const n = next.calls[i] || null, o = state.calls[i];
        const status = n && n.status === 'assembling' ? 'assembling' : 'calling';
        if (n && (!o || !sameSeq(o.no, n.no))) {   // 41 과 "041" 은 같은 번호로 봄 (차임 중복 방지)
          state.calls[i] = { no: n.no, at: n.silent ? 0 : (n.at || Date.now()), status };
          if (status === 'calling' && !n.silent) entered.push(i);
        } else if (n) state.calls[i].status = status;      // 같은 번호, 상태만 변경 (호출 중 → 조립 중)
        else state.calls[i] = null;
      });
    }
    let waitingChanged = false;
    if (Array.isArray(next.waiting)) {
      waitingChanged = next.waiting.join(',') !== state.waiting.join(',');
      state.waiting = next.waiting.slice();
    }
    renderSlots(entered);
    if (waitingChanged) renderWaiting();      // 목록이 바뀌었을 때만 다시 그림
    if (entered.length) { chime(); setTimeout(() => entered.forEach(speakCall), 800); }   // 차임이 끝난 뒤 한 번씩 음성 안내
  },
  setOnline(ok) { $('offline').classList.toggle('show', !ok); },
};

/* ---------- 관리자 팝업 (사업단 로고 3초 안에 7번 클릭) ---------- */
const adminEl = $('admin'); let pw = '', taps = [];
function pwRender(msg = '') { $('pwView').textContent = '●'.repeat(pw.length); $('pwMsg').textContent = msg; }
function adminOpen() { pw = ''; pwRender(); adminEl.classList.add('show'); }
function adminClose() { adminEl.classList.remove('show'); pw = ''; }
function adminExit() {
  adminExited = true; adminClose();
  try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e) {}
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  try { window.close(); } catch (e) {}       // 스크립트로 연 창이 아니면 브라우저가 무시함
}
function pwSubmit() {
  if (pw === CONFIG.ADMIN_PW) { adminExit(); return; }
  pw = ''; pwRender('비밀번호가 틀렸습니다');
}
function pwPress(d) { if (pw.length < 12) { pw += d; pwRender(); } }
(function () {
  const pad = $('pwPad');
  ['1','2','3','4','5','6','7','8','9','⌫','0','C'].forEach(k => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = k;
    b.onclick = () => k === '⌫' ? (pw = pw.slice(0, -1), pwRender()) : k === 'C' ? (pw = '', pwRender()) : pwPress(k);
    pad.appendChild(b);
  });
  $('pwOk').onclick = pwSubmit; $('pwCancel').onclick = adminClose;
  $('logoIot').addEventListener('click', () => {
    const now = Date.now();
    taps = taps.filter(t => now - t < CONFIG.ADMIN_WINDOW_MS); taps.push(now);
    if (taps.length >= CONFIG.ADMIN_TAPS) { taps = []; adminOpen(); }
  });
  addEventListener('keydown', e => {          // 물리 키보드로도 입력 가능
    if (!adminEl.classList.contains('show')) return;
    if (/^[0-9]$/.test(e.key)) pwPress(e.key);
    else if (e.key === 'Backspace') { pw = pw.slice(0, -1); pwRender(); }
    else if (e.key === 'Enter') pwSubmit();
  });
})();

/* ---------- 전시용 안전장치 ---------- */
// 우클릭 메뉴·드래그·선택·확대(핀치, Ctrl+휠, Ctrl +/-)·새로고침/닫기 실수 방지
['contextmenu', 'dragstart', 'selectstart', 'gesturestart'].forEach(ev => addEventListener(ev, e => e.preventDefault()));
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
});
addEventListener('beforeunload', e => { if (!adminExited) { e.preventDefault(); e.returnValue = ''; } });   // 실수로 닫기·새로고침 시 확인창

// 화면 꺼짐 방지 (HTTPS 필요, 탭이 다시 보이면 재요청)
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !adminExited) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();

renderSlots(); renderWaiting();
poll();
</script>
